spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/dosimetros_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway gestiona el esquema (corre antes de la validación de Hibernate).
# Las migraciones viven en src/main/resources/db/migration.
spring.flyway.enabled=true

spring.profiles.active=local
# JWT — secret de mínimo 32 caracteres para HMAC-SHA256
jwt.secret=affc0cf53e35e4b878a1e8d20f7595bd4c83fc728b197cd7d2b6c37a89272412
jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG