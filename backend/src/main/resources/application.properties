spring.application.name=backend

# --- Base de datos ---
# Todos los valores sensibles se leen de variables de entorno; los valores
# tras ':' son solo defaults para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dosimetros_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway gestiona el esquema (corre antes de la validación de Hibernate).
# Las migraciones viven en src/main/resources/db/migration.
spring.flyway.enabled=true

# --- JWT ---
# En producción DEFINIR jwt.secret por variable de entorno (mínimo 32 chars).
jwt.secret=${JWT_SECRET:affc0cf53e35e4b878a1e8d20f7595bd4c83fc728b197cd7d2b6c37a89272412}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Orígenes permitidos para el frontend, separados por coma.
# En dev se usa el proxy de Vite (mismo origen), por eso queda vacío por defecto.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Logging ---
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
